; VEXA — Export presets
;
; INSTRUCTION 3 scope: PLATFORM = PC WINDOWS NATIVE ONLY.
; VEXA is a native Windows application. It is NOT a web/HTML5/WebGL build and
; must never depend on a browser to run.
;
; Only the Windows Desktop preset is defined. No Web preset exists, by design.
; Final export/compression/packaging tuning belongs to INSTRUCTION 116.

[preset.0]

name="VEXA - Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*, imagenes-de-referencia-/*"
export_path="build/windows/VEXA.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.svg"
